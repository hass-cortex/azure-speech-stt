transcribe:
  description: 'Transcribe audio data with Azure STT and correction'
  fields:
    audio_data:
      description: 'Base64 encoded WAV audio (PCM 16kHz mono 16-bit)'
      required: true
      selector:
        text:
    format:
      description: 'Audio format'
      default: 'wav'
      selector:
        select:
          options:
            - 'wav'
            - 'ogg'
    codec:
      description: 'Audio codec'
      default: 'pcm'
      selector:
        select:
          options:
            - 'pcm'
            - 'opus'
    language:
      description: 'BCP-47 language code'
      default: 'en-US'
      selector:
        text:
    apply_correction:
      description: 'Apply post-recognition correction'
      default: true
      selector:
        boolean:

add_phrases:
  description: 'Add phrases to the recognition hints list'
  fields:
    phrases:
      description: 'List of phrases to add'
      required: true
      example: '["Living Room Light", "Kitchen Fan"]'
      selector:
        object:

remove_phrases:
  description: 'Remove phrases from the recognition hints list'
  fields:
    phrases:
      description: 'List of phrases to remove'
      required: true
      example: '["Living Room Light"]'
      selector:
        object:

add_replacements:
  description: 'Add or update custom replacement rules'
  fields:
    replacements:
      description: 'Dictionary of wrong→correct replacement pairs'
      required: true
      example: '{"livin room": "living room", "kichen light": "kitchen light"}'
      selector:
        object:

remove_replacements:
  description: 'Remove custom replacement rules by key'
  fields:
    keys:
      description: 'List of replacement keys (wrong text) to remove'
      required: true
      example: '["livin room"]'
      selector:
        object:

get_correction_config:
  description: 'Get the current correction configuration'

set_correction_config:
  description: 'Import correction configuration (from get_correction_config output)'
  fields:
    custom_phrases:
      description: 'List of recognition hint phrases'
      selector:
        object:
    custom_replacements:
      description: 'Dictionary of wrong→correct replacement pairs'
      selector:
        object:
    enable_custom_replacements:
      description: 'Enable custom replacement rules'
      selector:
        boolean:
    enable_fuzzy_matching:
      description: 'Enable similarity matching'
      selector:
        boolean:
    fuzzy_threshold:
      description: 'Matching sensitivity (0.5–1.0)'
      selector:
        number:
          min: 0.5
          max: 1.0
          step: 0.05
    custom_exclusions:
      description: 'List of segments to never correct'
      selector:
        object:

add_exclusions:
  description: 'Add segments to the exclusion list'
  fields:
    exclusions:
      description: 'List of segments to exclude from correction'
      required: true
      example: '["pocket", "chicken"]'
      selector:
        object:

remove_exclusions:
  description: 'Remove segments from the exclusion list'
  fields:
    exclusions:
      description: 'List of segments to remove from exclusion list'
      required: true
      example: '["pocket"]'
      selector:
        object:

test_correction:
  description: 'Test correction pipeline with diagnostic output'
  fields:
    text:
      description: 'Text to run through the correction pipeline'
      required: true
      example: 'turn on the livin room lite'
      selector:
        text:

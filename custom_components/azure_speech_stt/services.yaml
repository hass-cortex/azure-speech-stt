transcribe:
  description: 'Transcribe audio data with Azure Speech-to-Text'
  fields:
    entity_id:
      description: 'Target Azure Speech STT entity'
      required: true
      example: 'stt.azure_stt_japanwest'
      selector:
        entity:
          integration: azure_speech_stt
          domain: stt
    audio_data:
      description: 'Base64 encoded WAV audio (PCM 16kHz mono 16-bit)'
      required: true
      selector:
        text:
    format:
      description: 'Audio format'
      default: 'wav'
      selector:
        select:
          options:
            - 'wav'
            - 'ogg'
    codec:
      description: 'Audio codec'
      default: 'pcm'
      selector:
        select:
          options:
            - 'pcm'
            - 'opus'
    language:
      description: 'BCP-47 language code'
      default: 'en-US'
      selector:
        text:
